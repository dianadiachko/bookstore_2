{% extends "shop/base.html" %}

{% block content %}
<h2>Delete {{ object.title }}?</h2>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'shop:detail' object.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
