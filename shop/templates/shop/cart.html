<h1>Кошик</h1>

{% if items %}
    <ul>
        {% for item in items %}
            <li>
                {{ item.book.title }} —
                {{ item.quantity }} × {{ item.price }}$
            </li>
        {% endfor %}
    </ul>

    <h3>Всього: {{ items|length }}</h3>

    <a href="{% url 'shop:checkout' %}">
        <button>Оформити замовлення</button>
    </a>

{% else %}
    <p>Кошик порожній</p>
{% endif %}
