{% extends "shop/base.html" %}

{% block content %}

<h1>Книги</h1>

<!-- ФИЛЬТР -->
<form method="get" style="margin-bottom: 20px;">
    <input type="text" name="search" placeholder="Пошук книги..." value="{{ request.GET.search }}">

    <select name="category">
        <option value="">Всі категорії</option>
        {% for c in categories %}
            <option value="{{ c.id }}" {% if request.GET.category == c.id|stringformat:"s" %}selected{% endif %}>
                {{ c.name }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Пошук</button>
</form>

<hr>

<!-- КНИГИ -->
{% for book in books %}
    <div style="border:1px solid #ddd; padding:10px; margin-bottom:10px;">
        <h3>{{ book.title }}</h3>
        <p>Автор: {{ book.author }}</p>
        <p>Категорія: {{ book.category }}</p>

        <a href="{% url 'shop:detail' book.pk %}">Детальніше</a>

        <!-- В КОРЗИНУ -->
        <a href="{% url 'shop:add_to_cart' book.pk %}" style="margin-left:10px;">
            В кошик
        </a>
    </div>
{% empty %}
    <p>Нічого не знайдено</p>
{% endfor %}

{% endblock %}
